name: Build Linux App

on:
  push:
    branches: [ qt ]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /toolcache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y portaudio19-dev python3-pyaudio patchelf

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements-linux.txt
          pip install nuitka argparse requests

      - name: Build with Nuitka
        run: nuitka underbridge.py

      - name: List output files
        run: ls dist/

      - name: Zip the output
        run: python zipit.py underbridge_lin underbridge-light-linux.zip

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: qt
          name: "Underbridge-light Release (qt)"
          draft: false
          prerelease: false
          files: underbridge-light-linux.zip

      - name: Upload to Server
        run: |
          packit/ubridge/bin/python nc_upload.py ${{ secrets.UBRIDGE_USER }} ${{ secrets.UBRIDGE_PASSWD }} https://cloud.raise-uav.com/ underbridge-light-linux.zip App_Release/light/underbridge-light-linux.zip

